name: Keep Alive Ping

on:
  schedule:
    - cron: '*/10 * * * *' # Run every 10 minutes
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping to Express API
        run: |
          # Replace the URL below with your actual Render/Railway/Heroku deployed URL
          API_URL="http://localhost:8081"
          echo "Pinging health endpoint at $API_URL/health"
          curl -f -s "$API_URL/health" || echo "API keep-alive failed or not yet deployed."
