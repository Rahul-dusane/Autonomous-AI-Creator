services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_creator_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-aicreator_db}
      POSTGRES_USER: ${DB_USER:-aicreator}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aicreator}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aicreator} -d ${DB_NAME:-aicreator_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_creator_api
    restart: always
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aicreator_db}
      DB_USER: ${DB_USER:-aicreator}
      DB_PASSWORD: ${DB_PASSWORD:-aicreator}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      BREETH_API_KEY: ${BREETH_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_creator_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata: